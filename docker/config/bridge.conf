# ipc-relay-bridge configuration for the container setup (docker/compose.yaml).
#
# The test publisher binds its sockets in /run/ipc-relay, a volume shared with
# this container. Multicast goes out on the container's eth0 onto the compose
# network, where the receiver container joins the group.

multicast_group     = 239.192.10.1
multicast_port      = 5100
multicast_interface = eth0
multicast_ttl       = 1
multicast_loopback  = false
max_datagram_size   = 1400
send_buffer_bytes   = 4194304
send_timeout_ms     = 100

zmq_recv_hwm          = 10000
max_messages_per_poll = 32
reconnect_ivl_ms      = 100

stats_interval_ms = 5000
log_level         = info

[source]
id       = 10
name     = navigation
endpoint = ipc:///run/ipc-relay/nav.sock

[source]
id       = 20
name     = imu
endpoint = ipc:///run/ipc-relay/imu.sock
recv_hwm = 50000

[source]
id       = 30
name     = logs
endpoint = ipc:///run/ipc-relay/log.sock
