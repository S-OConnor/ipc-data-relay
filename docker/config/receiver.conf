# ipc-relay-receiver configuration for the container setup (docker/compose.yaml).
#
# Joins the bridge's group on the container's eth0 and records to
# /var/lib/ipc-relay (a volume). Statistics are published on every interface
# so the ctl container and the host (published port) can monitor them. The
# command endpoint is bound too, so the ctl container (web control page) can
# connect to it; inside this container use "ipc-relay-ctl send --connect ...".
# Port 5557 is not published to the host: commands are unauthenticated.

multicast_group        = 239.192.10.1
multicast_port         = 5100
multicast_interface    = eth0
receive_buffer_bytes   = 4194304
max_datagrams_per_poll = 64

capture_file              = /var/lib/ipc-relay/capture.cap
record_on_start           = true
capture_buffer_bytes      = 1048576
capture_flush_interval_ms = 1000
capture_sync_on_flush     = false

reassembly_timeout_ms        = 500
reassembly_max_pending       = 256
reassembly_max_message_bytes = 16777216

stats_endpoint    = tcp://*:5556
stats_topic       = stats
stats_interval_ms = 1000
stats_print       = false
command_endpoint  = tcp://*:5557
command_bind      = true
command_topic     =

log_level = info
