# Example: three independent IPC publishers feeding one multicast stream
# (BRG-144). Run with:
#   ipc-relay-testpub -e ipc:///tmp/nav.sock -e ipc:///tmp/imu.sock -e ipc:///tmp/log.sock --count 0 &
#   ipc-relay-bridge --config examples/bridge-three-publishers.conf

multicast_group     = 239.192.10.1
multicast_port      = 5100
multicast_interface = 127.0.0.1      # loopback for a single-host demo
multicast_ttl       = 0
max_datagram_size   = 1400
stats_interval_ms   = 2000

[source]
id       = 10
name     = navigation
endpoint = ipc:///tmp/nav.sock

[source]
id       = 20
name     = imu
endpoint = ipc:///tmp/imu.sock
recv_hwm = 50000                     # high-rate source: deeper queue

[source]
id       = 30
name     = logs
endpoint = ipc:///tmp/log.sock
filter   = ERR                       # only forward ERR-prefixed and WARN-prefixed log lines
filter   = WARN
