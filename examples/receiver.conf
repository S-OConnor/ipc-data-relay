# ipc-relay-receiver configuration
#
# Joins the bridge's multicast group, reassembles fragmented messages,
# records them to a single binary capture file and publishes statistics.

# --- UDP multicast input ----------------------------------------------------
multicast_group        = 239.192.10.1
multicast_port         = 5100
multicast_interface    = eth0        # interface name or IPv4 address; "" = default
receive_buffer_bytes   = 4194304     # SO_RCVBUF; raise net.core.rmem_max if the kernel clamps it
max_datagrams_per_poll = 64

# --- Binary capture ---------------------------------------------------------
capture_file              = /var/log/ipc-relay/capture.cap
record_on_start           = true     # false = wait for "record on" over the command channel
capture_buffer_bytes      = 1048576  # userspace write buffer
capture_flush_interval_ms = 1000     # flush to the kernel every N ms (0 = only on close/command)
capture_sync_on_flush     = false    # also fsync() on each periodic flush

# --- Reassembly -------------------------------------------------------------
reassembly_timeout_ms        = 500   # discard partially received messages after this long
reassembly_max_pending       = 256   # bound on partially received messages held in memory
reassembly_max_message_bytes = 16777216

# --- ZeroMQ TCP statistics publisher (PUB) and command subscriber (SUB) -----
stats_endpoint    = tcp://*:5556     # "" disables. Monitor: ipc-relay-ctl monitor -e tcp://HOST:5556
stats_topic       = stats
stats_interval_ms = 1000
stats_print       = false            # also log each statistics message
command_endpoint  = tcp://127.0.0.1:5557   # "" disables. Control: ipc-relay-ctl send "record off"
command_bind      = false            # false: connect to the controller's PUB; true: bind here
command_topic     =                  # subscription prefix; empty = accept all

log_level = info
