# ipc-relay-bridge configuration
#
# Subscribes to N ZeroMQ IPC publishers and republishes every message over
# one UDP multicast stream. Global options come first; each [source] block
# adds one ZeroMQ SUB socket.

# --- UDP multicast output ---------------------------------------------------
multicast_group     = 239.192.10.1   # destination group (224.0.0.0/4)
multicast_port      = 5100           # destination UDP port
multicast_interface = eth0           # interface name or IPv4 address; "" = default route
multicast_ttl       = 1              # 0 = host only, 1 = local subnet
multicast_loopback  = true           # deliver to receivers on this host too
max_datagram_size   = 1400           # UDP payload bytes incl. the 44-byte header (avoids IP fragmentation on 1500 MTU)
send_buffer_bytes   = 4194304        # SO_SNDBUF; 0 = kernel default
send_timeout_ms     = 100            # bounded blocking when the socket buffer is full

# --- ZeroMQ input -----------------------------------------------------------
zmq_recv_hwm          = 10000        # default ZMQ_RCVHWM per source (messages)
max_messages_per_poll = 32           # fairness: max messages drained per source per poll round
reconnect_ivl_ms      = 100          # reconnect interval for publishers that are not up yet

# --- Runtime ----------------------------------------------------------------
stats_interval_ms = 5000             # log counters every N ms (0 = never)
log_level         = info             # error | warn | info | debug

# --- Sources ----------------------------------------------------------------
[source]
id       = 1                         # unique 32-bit source identifier placed in every datagram
name     = telemetry
endpoint = ipc:///run/app/telemetry.sock
# no filter => subscribe to all messages

[source]
id       = 2
name     = debug
endpoint = ipc:///run/app/debug.sock
filter   = DBG                       # ZeroMQ prefix filter; repeat "filter =" for several prefixes
